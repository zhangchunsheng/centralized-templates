<svg xmlns="http://www.w3.org/2000/svg"
     width="720"
     height="180"
     viewBox="0 0 720 180">

  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3"
          flood-color="#2563EB" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Logo 图形 -->
  <g transform="translate(20,20)" filter="url(#shadow)">
    <!-- 六边形 -->
    <polygon
      points="70,0 140,40 140,120 70,160 0,120 0,40"
      fill="url(#g1)"
      rx="10"/>

    <!-- 芯片 -->
    <rect x="42" y="42"
          width="56"
          height="56"
          rx="8"
          fill="white"
          opacity="0.95"/>

    <!-- AI -->
    <text x="70"
          y="78"
          font-size="24"
          font-weight="700"
          text-anchor="middle"
          fill="#2563EB"
          font-family="Arial, Helvetica, sans-serif">
      AI
    </text>

    <!-- 电路线 -->
    <g stroke="white" stroke-width="4" stroke-linecap="round">
      <line x1="70" y1="42" x2="70" y2="18"/>
      <line x1="70" y1="98" x2="70" y2="142"/>
      <line x1="42" y1="70" x2="18" y2="70"/>
      <line x1="98" y1="70" x2="122" y2="70"/>

      <circle cx="70" cy="18" r="4" fill="white"/>
      <circle cx="70" cy="142" r="4" fill="white"/>
      <circle cx="18" cy="70" r="4" fill="white"/>
      <circle cx="122" cy="70" r="4" fill="white"/>
    </g>
  </g>

  <!-- 品牌文字 -->
  <text x="195"
        y="105"
        font-size="60"
        font-weight="700"
        fill="#111827"
        font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif">
      烙馍
  </text>

  <text x="350"
        y="105"
        font-size="60"
        font-weight="700"
        fill="url(#g2)"
        font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif">
      智擎
  </text>

  <!-- slogan -->
  <text x="198"
        y="140"
        font-size="18"
        letter-spacing="2"
        fill="#6B7280"
        font-family="Arial, sans-serif">
      AI ENGINE · POWERING THE FUTURE
  </text>

</svg>